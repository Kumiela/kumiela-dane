name: Zbieraj dane Kumieli

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zbieraj
  cancel-in-progress: false

jobs:
  zbieraj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz dane
        run: python3 zbieraj.py
      - name: Zapisz w repozytorium
        run: |
          git config user.name "zbieracz-kumieli"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dane archiwum
          if git diff --cached --quiet; then
            echo "Brak zmian"
          else
            git commit -q -m "dane $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase
            git push -q
          fi
